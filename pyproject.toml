[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payments-gateway"
version = "0.1.0"
description = "Payment data platform: Kinesis → Firehose → S3 bronze → Glue silver/gold → Athena"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.34",
  "pydantic>=2.5",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "moto[kinesis]>=5.0",
  "ruff>=0.9",
  "black>=25.1",
]

[project.scripts]
payments-simulator = "payments_gateway.simulator:main"

[tool.hatch.build.targets.wheel]
packages = ["src/payments_gateway"]

[tool.hatch.build.targets.wheel.force-include]
"src/payments_gateway" = "payments_gateway"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests", "pipelines"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 88
target-version = ["py310"]
